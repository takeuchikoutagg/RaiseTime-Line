spring.application.name=raisetime

# Taskmanagement（8080）と重ならないポートにする
server.port=8081

# Docker Compose の PostgreSQL（Taskmanagement の 5433 と重ならないよう 5434）
spring.datasource.url=jdbc:postgresql://127.0.0.1:5434/raisetime
spring.datasource.username=raisetime
spring.datasource.password=raisetime

# テーブルは Flyway（src/main/resources/db/migration/）だけが作る
spring.flyway.locations=classpath:db/migration

# MyBatis：SQL は src/main/resources/mapper/ の XML に書く。password_hash → passwordHash のように対応させる
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# ALB のヘルスチェック用に /actuator/health だけを公開する
management.endpoints.web.exposure.include=health
