spring.application.name=raisetime

# Taskmanagement（8080）と重ならないポートにする
server.port=8081

# Docker Compose の PostgreSQL（Taskmanagement の 5433 と重ならないよう 5434）
spring.datasource.url=jdbc:postgresql://127.0.0.1:5434/raisetime
spring.datasource.username=raisetime
spring.datasource.password=raisetime

# テーブルは Flyway（src/main/resources/db/migration/）だけが作る
spring.flyway.locations=classpath:db/migration

# MyBatis：SQL は src/main/resources/mapper/ の XML に書く。password_hash → passwordHash のように対応させる
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
# UUID などの型変換（com.example.raisetime.mapper.typehandler）
mybatis.type-handlers-package=com.example.raisetime.mapper.typehandler

# 認証：JWT のアクセストークン（15分）とリフレッシュトークン（7日）を、どちらも HttpOnly Cookie で渡す
# JWT の署名に使う秘密鍵（HS256。32バイト以上）。開発用の値なので、本番は環境変数 JWT_SECRET で必ず上書きする
app.auth.jwt-secret=${JWT_SECRET:dev-only-jwt-secret-do-not-use-in-production-0123456789}
app.auth.access-token-ttl=15m
app.auth.refresh-token-ttl=7d
# Cookie に Secure を付けるか（HTTPS でだけ送る）。開発は http のため false、本番は true にする
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}

# ALB のヘルスチェック用に /actuator/health だけを公開する
management.endpoints.web.exposure.include=health
