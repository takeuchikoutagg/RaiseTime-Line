spring.application.name=raisetime

# Taskmanagement（8080）と重ならないポートにする
server.port=8081

# Docker Compose の PostgreSQL（Taskmanagement の 5433 と重ならないよう 5434）
spring.datasource.url=jdbc:postgresql://127.0.0.1:5434/raisetime
spring.datasource.username=raisetime
spring.datasource.password=raisetime

# テーブルは Flyway（src/main/resources/db/migration/）だけが作る
spring.flyway.locations=classpath:db/migration

# MyBatis：SQL は src/main/resources/mapper/ の XML に書く。password_hash → passwordHash のように対応させる
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
# UUID などの型変換（com.example.raisetime.mapper.typehandler）
mybatis.type-handlers-package=com.example.raisetime.mapper.typehandler

# 認証：JWT のアクセストークン（15分）とリフレッシュトークン（7日）を、どちらも HttpOnly Cookie で渡す
# JWT の署名に使う秘密鍵（HS256。32バイト以上）。環境変数 JWT_SECRET で渡す。
# 既定値は置かない：設定し忘れたまま本番で動くと、コードに書いた鍵で誰でもトークンを作れてしまうため、起動しないようにする。
# 開発・テスト用の値は application-dev.properties にある（start.sh とテストで dev プロファイルを使う）
app.auth.jwt-secret=${JWT_SECRET:}
app.auth.access-token-ttl=15m
app.auth.refresh-token-ttl=7d
# Cookie に Secure を付けるか（HTTPS でだけ送る）。設定し忘れても安全な側になるよう、既定は true。
# 開発は http のため、application-dev.properties で false にしている
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}

# 投稿画像の保存先（S3）。開発は Docker Compose の S3Mock（http://localhost:9090）を使う。
# 本番は endpoint を空にして AWS S3 を使い、権限は EC2 の IAM ロールから得る（アクセスキーは使わない）
app.storage.bucket=${STORAGE_BUCKET:raisetime-images}
app.storage.region=${STORAGE_REGION:ap-northeast-1}
app.storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9090}
# 画像を表示するときの URL の頭の部分（本番は CloudFront の https://{ドメイン}/images）
app.storage.public-base-url=${STORAGE_PUBLIC_BASE_URL:http://localhost:9090/raisetime-images}

# 画像のアップロード：1枚5MBまで、4枚＋本文で1回のリクエストは21MBまで
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=21MB

# ALB のヘルスチェック用に /actuator/health だけを公開する
management.endpoints.web.exposure.include=health

# ALB の後ろで動かすとき、X-Forwarded-For・X-Forwarded-Proto を見て、利用者の IP アドレスと https かどうかを知る。
# 信用するのは VPC 内（プライベート IP）のプロキシ（ALB）から来たヘッダーだけ（Tomcat の RemoteIpValve の標準の動き）。
# ログイン試行回数の制限（LoginAttemptService）は IP アドレスごとにも数えるため、ALB の IP にならないようにする
server.forward-headers-strategy=native

# API 仕様書（/v3/api-docs）と Swagger UI（/swagger-ui.html）。本番では API の一覧を外に見せないよう無効にする。
# 開発では application-dev.properties で有効にしている
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
# GlobalExceptionHandler のエラーを全 API のレスポンスに自動で足さない（API ごとに @ApiErrors で書く。OpenApiConfig を参照）
springdoc.override-with-generic-response=false
# 書き出す順番を毎回同じにする（docs/api/openapi.yaml の差分が、API を変えたところだけになるように）
springdoc.writer-with-order-by-keys=true
# multipart/form-data の API では、@RequestParam の項目（本文など）もフォームの項目として書く（クエリ文字列ではない）
springdoc.default-support-form-data=true
# レスポンスは JSON
springdoc.default-produces-media-type=application/json
