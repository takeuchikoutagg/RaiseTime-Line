spring.application.name=raisetime

# Taskmanagement（8080）と重ならないポートにする
server.port=8081

# Docker Compose の PostgreSQL（Taskmanagement の 5433 と重ならないよう 5434）
spring.datasource.url=jdbc:postgresql://127.0.0.1:5434/raisetime
spring.datasource.username=raisetime
spring.datasource.password=raisetime

# テーブルは Flyway（src/main/resources/db/migration/）だけが作る
spring.flyway.locations=classpath:db/migration

# MyBatis：SQL は src/main/resources/mapper/ の XML に書く。password_hash → passwordHash のように対応させる
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# セッション：Spring Session JDBC で PostgreSQL に保存する（テーブルは Flyway の V2 で作る）
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=30m
# セッション Cookie は JavaScript から読めないようにし、別サイトからの POST には付かないようにする
# （本番は HTTPS のため Secure も付ける。インフラ構築工程で設定する）
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ALB のヘルスチェック用に /actuator/health だけを公開する
management.endpoints.web.exposure.include=health
