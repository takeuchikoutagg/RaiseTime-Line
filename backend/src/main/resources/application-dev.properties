# 開発・テスト用の設定（dev プロファイル）。start.sh と ./gradlew test で有効になる。本番では使わない
# JWT の署名に使う秘密鍵。開発用の値なので、本番は環境変数 JWT_SECRET で渡す（application.properties を参照）
app.auth.jwt-secret=${JWT_SECRET:dev-only-jwt-secret-do-not-use-in-production-0123456789}
# 開発は http のため、Cookie に Secure を付けない
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
# API 仕様書（http://localhost:8081/v3/api-docs）と Swagger UI（http://localhost:8081/swagger-ui.html）を有効にする
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# Swagger UI から POST などを試すとき、XSRF-TOKEN Cookie の値を X-XSRF-TOKEN ヘッダーに入れて送る（CSRF 対策のため必須）
springdoc.swagger-ui.csrf.enabled=true
# API をタグ（機能）と、パス・メソッドの順に並べる
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
# ログは、開発では読みやすい文章のまま出す（本番は JSON。application.properties を参照）
logging.structured.format.console=
# 文章のログにも、リクエストID を出す（同じリクエストのログ・アクセスログを見分けられるように）
logging.pattern.correlation=[%X{request_id:-}] 
