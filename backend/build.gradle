plugins {
	id 'java'
	id 'checkstyle'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	mybatisSpringBootVersion = '4.1.0'
	awsSdkVersion = '2.55.9'
	springdocVersion = '3.1.1'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// JWT の署名・検証（Nimbus）と、リクエストの JWT を検証するフィルター
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation "org.mybatis.spring.boot:mybatis-spring-boot-starter:${mybatisSpringBootVersion}"
	// 投稿画像の保存先（本番は AWS S3、開発は S3 互換の S3Mock）
	implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
	implementation 'software.amazon.awssdk:s3'
	// API 仕様書（OpenAPI）の自動生成と Swagger UI。開発（dev プロファイル）だけ有効にする
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation "org.mybatis.spring.boot:mybatis-spring-boot-starter-test:${mybatisSpringBootVersion}"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// テストは開発用の設定（application-dev.properties）で動かす
	systemProperty 'spring.profiles.active', 'dev'
}

// API 仕様書（docs/api/openapi.yaml）を作り直す。API を変えたら実行してコミットする（PostgreSQL の起動が必要）。
// 中身は OpenApiDocumentTest を「書き出すモード」で動かしているだけ
tasks.register('generateOpenApi', Test) {
	description = 'API 仕様書（docs/api/openapi.yaml）を作り直す'
	group = 'documentation'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	filter {
		includeTestsMatching 'com.example.raisetime.OpenApiDocumentTest'
	}
	systemProperty 'spring.profiles.active', 'dev'
	systemProperty 'openapi.write', 'true'
	// 毎回必ず実行する（Gradle の「変更が無ければ飛ばす」を使わない）
	outputs.upToDateWhen { false }
}

checkstyle {
	toolVersion = '10.20.2'
	configFile = file('config/checkstyle/checkstyle.xml')
	sourceSets = [sourceSets.main]
}
