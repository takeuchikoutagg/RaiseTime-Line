services:
  postgres:
    image: postgres:17
    container_name: raisetime-postgres
    environment:
      POSTGRES_DB: raisetime
      POSTGRES_USER: raisetime
      POSTGRES_PASSWORD: raisetime
    ports:
      # Taskmanagement（5433）やローカルの PostgreSQL（5432）と重ならないよう 5434 にする
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 開発用の S3 の代わり（Adobe S3Mock）。本番は AWS S3 を使う。
  # MinIO は Docker イメージの配布が終わり、LocalStack はアカウント登録が必要になったため、これを使う。
  # 認証は無く、画像は http://localhost:9090/raisetime-images/{キー} でそのまま見られる
  s3mock:
    image: adobe/s3mock:latest
    container_name: raisetime-s3mock
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: raisetime-images
      # コンテナを作り直しても画像が残るよう、ボリュームに保存する
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "9090:9090"
    volumes:
      - s3mock_data:/s3mockroot

volumes:
  postgres_data:
  s3mock_data:
