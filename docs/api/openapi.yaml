          description: 入力内容・パラメーターに誤りがある（VALIDATION_ERROR / BAD_REQUEST）
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: ログインしていない、またはログインに失敗した（UNAUTHORIZED）
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 投稿・ユーザーなどが見つからない（NOT_FOUND）
      security:
      - cookieAuth: []
      summary: 投稿詳細を取得する
      tags:
      - 2. 投稿（F-03・F-04・F-10・F-11）
    patch:
      description: 投稿者本人だけ（他人の投稿は 403）。multipart/form-data。body（本文、必須）・keepImageIds（残す画像の
        id、複数可）・images（追加する画像）
      operationId: update
      parameters:
      - in: path
        name: postId
