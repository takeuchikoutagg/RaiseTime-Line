          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                body:
                  type: string
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                keepImageIds:
                  type: array
                  items:
                    type: integer
                    format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
