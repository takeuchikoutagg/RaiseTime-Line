        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 投稿・ユーザーなどが見つからない（NOT_FOUND）
      security:
      - cookieAuth: []
      summary: フォローを解除する
      tags:
      - 5. ユーザー（F-07・F-08・F-12）
    put:
      description: 2回呼んでも1回分（冪等）。自分自身は 400
      operationId: follow
      parameters:
      - in: path
        name: username
