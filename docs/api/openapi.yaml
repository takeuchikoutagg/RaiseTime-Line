      - cookieAuth: []
      summary: いいねを取り消す
      tags:
      - 4. いいね（F-06）
    put:
      description: 2回呼んでも1回分（冪等）
      operationId: like
      parameters:
      - in: path
        name: postId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResponse"
          description: OK
