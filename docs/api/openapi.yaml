openapi: 3.1.0
info:
  description: |
    RaiseTime Line（学習用のタイムライン型テキスト SNS）の REST API。
    仕様の背景・業務ルールは docs/機能定義書/ を参照。

    **ログイン**：アクセストークン（JWT）を `access_token` Cookie（HttpOnly）で受け取る。
    Swagger UI で試すときは、POST /api/auth/login を実行すると以降の API がログインした状態で呼べる。

    **CSRF**：POST・PUT・PATCH・DELETE は `X-XSRF-TOKEN` ヘッダーが必要。
    先に GET /api/auth/csrf を実行して `XSRF-TOKEN` Cookie を受け取ると、Swagger UI が自動でヘッダーに入れて送る。
  title: RaiseTime Line API
  version: v1
servers:
- url: /
tags:
- description: 投稿へのいいね・いいね解除
  name: 4. いいね（F-06）
- description: 新規登録・ログイン・ログアウト・トークンの更新
  name: 1. 認証（F-01・F-02）
- description: 投稿へのコメント
  name: 3. コメント（F-05）
- description: ユーザーページ・フォロー・プロフィール編集
  name: 5. ユーザー（F-07・F-08・F-12）
- description: タイムライン・投稿の作成・詳細・編集・削除
  name: 2. 投稿（F-03・F-04・F-10・F-11）
- description: '@ユーザーID・名前でユーザーを探す'
  name: 6. ユーザー検索（F-09）
paths:
  /api/auth/csrf:
    get:
      description: 画面を開いたときに最初に呼ぶ。POST などはこの値を X-XSRF-TOKEN ヘッダーで送る
      operationId: csrf
      responses:
        "204":
          description: No Content
      summary: CSRF トークンの Cookie（XSRF-TOKEN）を受け取る
      tags:
      - 1. 認証（F-01・F-02）
  /api/auth/login:
    post:
      description: アクセストークンとリフレッシュトークンを HttpOnly Cookie で返す。失敗が続くと 429
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力内容・パラメーターに誤りがある（VALIDATION_ERROR / BAD_REQUEST）
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: ログインしていない、またはログインに失敗した（UNAUTHORIZED）
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: CSRF トークンが無い・正しくない、または権限がない（FORBIDDEN）
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: ログインの失敗が続いた（TOO_MANY_REQUESTS）。Retry-After ヘッダーの秒数のあとに試せる
      summary: ログインする
      tags:
      - 1. 認証（F-01・F-02）
  /api/auth/logout:
    post:
      description: リフレッシュトークンを無効にし、トークンの Cookie を消す
      operationId: logout
      responses:
        "204":
          description: No Content
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: CSRF トークンが無い・正しくない、または権限がない（FORBIDDEN）
      summary: ログアウトする
      tags:
      - 1. 認証（F-01・F-02）
  /api/auth/me:
    get:
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: ログインしていない、またはログインに失敗した（UNAUTHORIZED）
      security:
      - cookieAuth: []
      summary: ログイン中のユーザーを取得する
      tags:
      - 1. 認証（F-01・F-02）
  /api/auth/refresh:
    post:
      description: アクセストークンの期限が切れたら呼ぶ。リフレッシュトークンを新しいものに交換する
      operationId: refresh
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: ログインしていない、またはログインに失敗した（UNAUTHORIZED）
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: CSRF トークンが無い・正しくない、または権限がない（FORBIDDEN）
      summary: トークンを更新する
      tags:
      - 1. 認証（F-01・F-02）
  /api/auth/signup:
    post:
      description: 登録したらそのままログインした状態になる（トークンの Cookie を返す）
      operationId: signup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力内容・パラメーターに誤りがある（VALIDATION_ERROR / BAD_REQUEST）
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: CSRF トークンが無い・正しくない、または権限がない（FORBIDDEN）
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: メールアドレス・@ユーザーID がすでに使われている（CONFLICT）
      summary: 新規登録する
      tags:
      - 1. 認証（F-01・F-02）
  /api/posts:
    post:
      description: multipart/form-data。body（本文、必須、1〜280文字）と images（画像、0〜4枚、1枚5MBまで）
      operationId: create
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                body:
                  type: string
                images:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostResponse"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力内容・パラメーターに誤りがある（VALIDATION_ERROR / BAD_REQUEST）
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: ログインしていない、またはログインに失敗した（UNAUTHORIZED）
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: CSRF トークンが無い・正しくない、または権限がない（FORBIDDEN）
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 画像が大きすぎる（PAYLOAD_TOO_LARGE）
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: サーバーのエラー、画像の保存の失敗（INTERNAL_ERROR）
      security:
      - cookieAuth: []
      summary: 投稿する
      tags:
      - 2. 投稿（F-03・F-04・F-10・F-11）
  /api/posts/{postId}:
    delete:
      description: 投稿者本人だけ（他人の投稿は 403）
      operationId: delete
      parameters:
      - in: path
        name: postId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力内容・パラメーターに誤りがある（VALIDATION_ERROR / BAD_REQUEST）
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: ログインしていない、またはログインに失敗した（UNAUTHORIZED）
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: CSRF トークンが無い・正しくない、または権限がない（FORBIDDEN）
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 投稿・ユーザーなどが見つからない（NOT_FOUND）
      security:
      - cookieAuth: []
      summary: 投稿を削除する
      tags:
      - 2. 投稿（F-03・F-04・F-10・F-11）
    get:
      operationId: findById
      parameters:
      - in: path
        name: postId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
