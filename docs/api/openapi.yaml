        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 投稿・ユーザーなどが見つからない（NOT_FOUND）
      security:
      - cookieAuth: []
      summary: いいねする
      tags:
      - 4. いいね（F-06）
  /api/search/users:
    get:
      description: "@ユーザーID か名前の部分一致で20件。続きは ?offset={nextOffset}"
      operationId: searchUsers
      parameters:
      - in: query
        name: q
        required: true
        schema:
          type: string
      - in: query
        name: offset
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSearchResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力内容・パラメーターに誤りがある（VALIDATION_ERROR / BAD_REQUEST）
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: ログインしていない、またはログインに失敗した（UNAUTHORIZED）
      security:
      - cookieAuth: []
      summary: ユーザーを検索する
      tags:
      - 6. ユーザー検索（F-09）
  /api/timeline:
    get:
      description: "自分＋フォロー中の人の投稿を新しい順に20件。次のページは ?before={nextCursor}"
      operationId: timeline
      parameters:
