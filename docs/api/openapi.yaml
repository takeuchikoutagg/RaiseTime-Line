  /api/users/me:
    patch:
      description: multipart/form-data。name（表示名、必須）・username（@ユーザーID、必須）・bio（自己紹介文）・avatar（プロフィール画像、2MBまで）・removeAvatar（画像を外すか）
      operationId: updateProfile
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
                bio:
                  type: string
                name:
                  type: string
                removeAvatar:
                  type: boolean
                  default: false
                username:
                  type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力内容・パラメーターに誤りがある（VALIDATION_ERROR / BAD_REQUEST）
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: ログインしていない、またはログインに失敗した（UNAUTHORIZED）
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: CSRF トークンが無い・正しくない、または権限がない（FORBIDDEN）
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: メールアドレス・@ユーザーID がすでに使われている（CONFLICT）
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 画像が大きすぎる（PAYLOAD_TOO_LARGE）
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: サーバーのエラー、画像の保存の失敗（INTERNAL_ERROR）
      security:
      - cookieAuth: []
      summary: プロフィールを編集する
      tags:
      - 5. ユーザー（F-07・F-08・F-12）
  /api/users/{username}:
    get:
      operationId: profile
      parameters:
      - in: path
        name: username
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: ログインしていない、またはログインに失敗した（UNAUTHORIZED）
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 投稿・ユーザーなどが見つからない（NOT_FOUND）
