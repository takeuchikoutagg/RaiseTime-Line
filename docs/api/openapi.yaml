        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 投稿・ユーザーなどが見つからない（NOT_FOUND）
      security:
      - cookieAuth: []
      summary: ユーザーの投稿一覧を取得する
      tags:
      - 5. ユーザー（F-07・F-08・F-12）
components:
  schemas:
    Author:
      type: object
      properties:
        avatarUrl:
          type: string
        name:
          type: string
        username:
          type: string
    CommentListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CommentResponse"
        nextCursor:
          type: integer
          format: int64
    CommentResponse:
      type: object
      properties:
        author:
          $ref: "#/components/schemas/Author"
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
    CreateCommentRequest:
      type: object
      properties:
        body:
          type: string
    ErrorResponse:
      properties:
        code:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldErrorResponse"
        message:
          type: string
    FieldErrorResponse:
      properties:
        field:
          type: string
        message:
          type: string
    FollowResponse:
      type: object
      properties:
        followedByMe:
          type: boolean
        followerCount:
          type: integer
          format: int64
    HasNewPostsResponse:
      type: object
      properties:
        hasNew:
          type: boolean
    Image:
      type: object
      properties:
        id:
          type: integer
          format: int64
        position:
          type: integer
          format: int32
        url:
          type: string
    LikeResponse:
      type: object
      properties:
        likeCount:
          type: integer
          format: int64
        likedByMe:
          type: boolean
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    PostResponse:
      type: object
      properties:
        author:
          $ref: "#/components/schemas/Author"
        body:
          type: string
        commentCount:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
        isMine:
          type: boolean
        likeCount:
          type: integer
          format: int64
        likedByMe:
          type: boolean
    SignupRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          minLength: 0
        name:
          type: string
          minLength: 1
        password:
          type: string
        username:
          type: string
          pattern: "^[a-z0-9_]{3,15}$"
      required:
      - email
      - name
      - password
      - username
    TimelineResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PostResponse"
        nextCursor:
          type: integer
          format: int64
    UserProfileResponse:
      type: object
      properties:
        avatarUrl:
          type: string
        bio:
          type: string
        followedByMe:
          type: boolean
        followerCount:
          type: integer
          format: int64
        followingCount:
          type: integer
          format: int64
        isMe:
          type: boolean
        name:
          type: string
        username:
          type: string
    UserResponse:
      type: object
      properties:
        avatarUrl:
          type: string
        name:
          type: string
        username:
          type: string
    UserSearchResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserSummaryResponse"
        nextOffset:
          type: integer
          format: int32
    UserSummaryResponse:
      type: object
      properties:
        avatarUrl:
          type: string
        followedByMe:
          type: boolean
        isMe:
          type: boolean
        name:
          type: string
        username:
          type: string
  securitySchemes:
    cookieAuth:
      description: ログインすると受け取るアクセストークン（JWT、15分）
      in: cookie
      name: access_token
      type: apiKey
