          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力内容・パラメーターに誤りがある（VALIDATION_ERROR / BAD_REQUEST）
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: ログインしていない、またはログインに失敗した（UNAUTHORIZED）
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: CSRF トークンが無い・正しくない、または権限がない（FORBIDDEN）
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 投稿・ユーザーなどが見つからない（NOT_FOUND）
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 画像が大きすぎる（PAYLOAD_TOO_LARGE）
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: サーバーのエラー、画像の保存の失敗（INTERNAL_ERROR）
      security:
      - cookieAuth: []
      summary: 投稿を編集する
      tags:
      - 2. 投稿（F-03・F-04・F-10・F-11）
  /api/posts/{postId}/comments:
    get:
      description: "古い順に20件。続きは ?after={nextCursor}"
      operationId: list
      parameters:
      - in: path
        name: postId
        required: true
        schema:
          type: integer
          format: int64
      - in: query
