        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 投稿・ユーザーなどが見つからない（NOT_FOUND）
      security:
      - cookieAuth: []
      summary: コメントする
      tags:
      - 3. コメント（F-05）
  /api/posts/{postId}/like:
